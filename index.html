<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/maintenance.css">
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-card">
            <div class="maintenance-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <h1 class="maintenance-title">Under Maintenance</h1>
            <p class="maintenance-message">We're currently performing scheduled maintenance to improve our services. We'll be back shortly.</p>
            <div class="maintenance-progress">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <p class="progress-text">Estimated completion time: <span class="countdown">30:00</span></p>
            </div>
            <div class="maintenance-contact">
                <p>Need immediate assistance?</p>
                <a href="" class="contact-link">Contact Support</a>
            </div>
        </div>
    </div>
    <script src="assets/js/maintenance.js"></script>
</body>
</html>
